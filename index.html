<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الجوائز | Handsome & Pretty</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f7f1fc;--bg2:#ece1f7;--glow1:rgba(193,138,232,.55);--ink:#26232d;--muted:#6f6b78;--accent:#9b5fc9;--deep:#5b3a80;--gold:#c9a45c;--tile:#fff;--glass:rgba(255,255,255,.66);--line:rgba(91,58,128,.15);--shadow:0 20px 50px rgba(91,58,128,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg1:#120f17;--bg2:#1c1524;--glow1:rgba(155,95,201,.38);--ink:#f3eff8;--muted:#aaa4b7;--accent:#c18ae8;--deep:#e2c9f4;--tile:#2b2237;--glass:rgba(40,31,52,.66);--line:rgba(255,255,255,.12);--shadow:0 20px 50px rgba(0,0,0,.5)}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:Cairo,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,var(--glow1),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1)}
main{max-width:440px;margin:0 auto;padding:16px 16px 28px}
.brand{text-align:center}.brand img{height:64px;width:auto;max-width:70%;object-fit:contain}
.card{background:var(--tile);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow);text-align:center}
h1{margin:6px 0 4px;font-size:26px;font-weight:900}.lead{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.7}
.lad{list-style:none;margin:0 0 16px;padding:0;text-align:right}
.lad li{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:6px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:700}
.lad li b{flex:none;min-width:58px;text-align:center;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,#f6e4b4,#c9a45c);color:#3a2a08;font-weight:900}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:14px 18px;font:inherit;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--accent),var(--deep));cursor:pointer;text-decoration:none;text-align:center;box-shadow:0 10px 24px var(--glow1)}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c4a);box-shadow:0 10px 24px rgba(37,211,102,.35)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn+.btn{margin-top:10px}.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:900}
.hud .sc{font-size:28px;color:var(--deep);line-height:1}.hud small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .2s}
.nx{margin:0 0 8px;font-size:13px;color:var(--muted);text-align:center;font-weight:700}
canvas{display:block;width:100%;height:auto;border-radius:24px;touch-action:none;box-shadow:var(--shadow);background:#2a1740}
.big{font-size:56px;font-weight:900;color:var(--deep);line-height:1.1}.pz{margin:12px 0;padding:14px;border-radius:20px;background:var(--glass);border:1px dashed var(--accent);font-weight:900;font-size:19px}
[hidden]{display:none!important}

<section id="s-start" class="card">
  <h1>🎮 لعبة الجوائز</h1>
  <p class="lead">اجمع الجواهر 💎 وتجنّب الحواجز 🚧. كل ما جمعت نقاط أكثر، كانت مكافأتك أكبر!</p>

</section>

<script>
// ===== Edit here =====
const WA_NUMBER="97124433221";      // digits only, with country code
const DURATION=45, LIVES=3;          // seconds, attempts (hearts)
const COOLDOWN_H=24;                 // hours between plays per device
const TIERS=[                        // points needed -> bonus
  {min:100,bonus:"استشارة مجانية",ic:"🎁"},
  {min:200,bonus:"خصم 5%",ic:"🏷️"},
  {min:300,bonus:"خصم 10%",ic:"🏷️"},
  {min:400,bonus:"جلسة أوكسجينيو مجانية",ic:"✨"},
  {min:500,bonus:"جلسة ليزر مجانية لمنطقة صغيرة",ic:"⚡"}
];
// =====================
const TEST=location.hash==="#test", KEY="hp_game_v1";
const $=id=>document.getElementById(id), pad=v=>String(v).padStart(2,"0");
const LOGO=new Image();LOGO.src=document.querySelector(".brand img").src;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(r){try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}}
function tierOf(p){let t=null;TIERS.forEach(x=>{if(p>=x.min)t=x});return t}
$("lad").innerHTML=TIERS.map(t=>'<li><b>'+t.min+'</b><span>'+t.ic+' '+t.bonus+'</span></li>').join("");
function show(id){["s-start","s-game","s-end"].forEach(x=>$(x).hidden=x!==id)}

// ---- game ----
const cv=$("cv"),cx=cv.getContext("2d"),W=360,H=520,HZ=60,PT=.86;
const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cx.scale(dpr,dpr);
let G=null,raf=0,last=0;
const rw=t=>80+260*t, lx=(l,t)=>W/2+(l-1)*rw(t)/3, ly=t=>HZ+t*(H-HZ-30);
function start(){
  G={el:0,score:0,lives:LIVES,items:[],sp:.4,lane:1,px:1,tl:1,pops:[],flash:0,off:0,over:false};
  show("s-game");hud();cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop);
}
function spawn(){
  const lane=Math.floor(Math.random()*3),r=Math.random();
  G.items.push({lane,t:0,k:r<.28?"x":r<.36?"h":"g"});
  if(Math.random()<.25){const l2=(lane+1+Math.floor(Math.random()*2))%3;G.items.push({lane:l2,t:0,k:Math.random()<.2?"h":"g"})}
}
function hud(){
  $("sc").textContent=G.score;$("tm").textContent=Math.max(0,Math.ceil(DURATION-G.el));
  $("lv").textContent="💜".repeat(G.lives)+"🤍".repeat(LIVES-G.lives);
  const cur=tierOf(G.score),nxt=TIERS.find(t=>t.min>G.score);
  const base=cur?cur.min:0;$("pg").style.width=(nxt?Math.min(100,(G.score-base)/(nxt.min-base)*100):100)+"%";
  $("nx").textContent=nxt?"باقي "+(nxt.min-G.score)+" نقطة لـ: "+nxt.bonus:"🎉 وصلت لأعلى مكافأة!";
}
let sp=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const g=G;g.el+=dt;
  g.sp=.42+g.el*.011;g.off=(g.off+g.sp*dt*9)%1;
  sp-=dt;if(sp<=0){spawn();sp=Math.max(.38,.8-g.el*.01)}
  g.px+=(g.lane-g.px)*Math.min(1,dt*16);
  g.items.forEach(i=>{i.t+=g.sp*dt});
  g.items=g.items.filter(i=>{
    if(!i.d&&i.lane===g.lane&&i.t>=PT-.07&&i.t<=PT+.05){
      i.d=true;
      if(i.k==="x"){g.lives--;g.score=Math.max(0,g.score-10);g.flash=.3;pop(i,"-10","#ff6b6b")}
      else{const v=i.k==="h"?25:10;g.score+=v;pop(i,"+"+v,"#ffe08a")}
      hud();return false;
    }
    return i.t<1.08;
  });
  g.pops.forEach(p=>{p.y-=40*dt;p.a-=dt*1.6});g.pops=g.pops.filter(p=>p.a>0);g.flash=Math.max(0,g.flash-dt);
  if(Math.floor(g.el*4)%1===0)hud();
  draw();
  if(g.el>=DURATION||g.lives<=0){end();return}
  raf=requestAnimationFrame(loop);
}
function pop(i,txt,c){G.pops.push({x:lx(i.lane,PT),y:ly(PT)-30,txt,c,a:1})}
function draw(){
  const g=G;cx.clearRect(0,0,W,H);
  const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#1d0f2e");bg.addColorStop(1,"#3b2160");cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  cx.beginPath();cx.moveTo(W/2-40,HZ);cx.lineTo(W/2+40,HZ);cx.lineTo(W/2+170,H);cx.lineTo(W/2-170,H);cx.closePath();
  const rg=cx.createLinearGradient(0,HZ,0,H);rg.addColorStop(0,"#4a2d78");rg.addColorStop(1,"#6b44a3");cx.fillStyle=rg;cx.fill();
  cx.strokeStyle="rgba(246,228,180,.55)";cx.lineWidth=3;
  for(let b=-1;b<=1;b+=2)for(let i=0;i<9;i++){
    const t0=(i+g.off)/9,t1=t0+.045;if(t1>1)continue;
    const o=b*.5;cx.beginPath();cx.moveTo(W/2+o*rw(t0)/3*1,ly(t0));cx.lineTo(W/2+o*rw(t1)/3*1,ly(t1));cx.stroke();
  }
  // lane separators sit between lanes: lanes at -1,0,1 -> borders at +-0.5 lane widths
  cx.textAlign="center";cx.textBaseline="middle";
  g.items.slice().sort((a,b)=>a.t-b.t).forEach(i=>{
    const s=14+46*i.t;cx.font=s+"px serif";cx.fillText(i.k==="x"?"🚧":i.k==="h"?"💜":"💎",lx(i.lane,i.t),ly(i.t));
  });
  const px=W/2+(g.px-1)*rw(PT)/3,py=ly(PT);
  cx.save();cx.beginPath();cx.arc(px,py,28,0,7);cx.fillStyle="#fff";cx.fill();cx.lineWidth=4;cx.strokeStyle="#c9a45c";cx.stroke();cx.clip();
  if(LOGO.complete&&LOGO.naturalWidth){const k=Math.min(46/LOGO.naturalWidth,46/LOGO.naturalHeight);cx.drawImage(LOGO,px-LOGO.naturalWidth*k/2,py-LOGO.naturalHeight*k/2,LOGO.naturalWidth*k,LOGO.naturalHeight*k)}
  cx.restore();
  cx.font="900 20px Cairo,sans-serif";g.pops.forEach(p=>{cx.globalAlpha=Math.max(0,p.a);cx.fillStyle=p.c;cx.fillText(p.txt,p.x,p.y)});cx.globalAlpha=1;
  if(g.flash>0){cx.fillStyle="rgba(255,60,60,"+g.flash*1.2+")";cx.fillRect(0,0,W,H)}
}
function move(d){if(G&&!G.over)G.lane=Math.max(0,Math.min(2,G.lane+d))}
let sx=null;
cv.addEventListener("pointerdown",e=>{sx=e.clientX});
cv.addEventListener("pointerup",e=>{
  if(sx===null)return;const dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>30)move(dx>0?1:-1);else{const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)}
});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")move(-1);if(e.key==="ArrowRight"||e.key==="d")move(1)});

// ---- end / claim ----
function end(){G.over=true;const score=G.score,code="GAME-"+score+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
  const rec={t:Date.now(),score,code};if(!TEST)save(rec);result(rec,true)}
function result(rec,fresh){
  show("s-end");const t=tierOf(rec.score);
  $("e-t").textContent=fresh?(t?"🎉 مبروك!":"انتهت اللعبة"):"نتيجتك اليوم";
  $("e-sc").textContent=rec.score;const wa=$("wa");
  if(t){
    $("e-pz").textContent=t.ic+" مكافأتك: "+t.bonus;$("e-pz").hidden=false;wa.hidden=false;wa.setAttribute("aria-disabled","false");
    const msg="مرحبًا Handsome & Pretty 👋\nلعبت لعبة الجوائز وحصلت على "+rec.score+" نقطة 🎉\nالمكافأة: "+t.bonus+"\nرمز المكافأة: "+rec.code+"\nأرجو تأكيد المكافأة.";
    wa.href="https://wa.me/"+WA_NUMBER.replace(/\D/g,"")+"?text="+encodeURIComponent(msg);
    $("e-note").textContent="أرسل الرسالة مع لقطة شاشة لهذه النتيجة لتأكيد مكافأتك.";
  }else{
    $("e-pz").textContent="تحتاج "+(TIERS[0].min-rec.score)+" نقطة للحصول على أول مكافأة";wa.hidden=true;
    $("e-note").textContent="حاول مرة أخرى بعد 24 ساعة 💜";
  }
}
function lockedLeft(rec){return rec.t+COOLDOWN_H*36e5-Date.now()}
function home(){
  const rec=load();
  if(rec&&!TEST&&lockedLeft(rec)>0){result(rec,false);tick(rec);return}
  show("s-start");
}
function tick(rec){
  const n=$("e-note"),base=tierOf(rec.score)?"أرسل الرسالة مع لقطة شاشة لهذه النتيجة لتأكيد مكافأتك. ":"";
  const f=()=>{const ms=lockedLeft(rec);if(ms<=0){location.reload();return}
    const s=Math.floor(ms/1000);n.textContent=base+"المحاولة القادمة بعد "+pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};
  f();setInterval(f,1000);
}
$("go").addEventListener("click",start);
home();
</script></body></html>
